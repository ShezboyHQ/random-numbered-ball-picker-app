<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Ball Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Ball Picker</h1>

        <div class="controls">
            <div class="input-group">
                <label for="minNumber">Minimum Number:</label>
                <input type="number" id="minNumber" value="1" min="1">
            </div>
            <div class="input-group">
                <label for="maxNumber">Maximum Number:</label>
                <input type="number" id="maxNumber" value="75" min="1">
            </div>
            <button id="startButton" class="start-btn">Pick a Number!</button>
        </div>

        <div class="bingo-cage">
            <div class="cage-container">
                <div class="sphere-container">
                    <div class="sphere-back"></div>
                    <div class="balls-container" id="ballsContainer"></div>
                    <div class="sphere-front"></div>
                    <div class="sphere-highlight"></div>
                </div>
                <div class="chute">
                    <div class="chute-opening"></div>
                    <div class="chute-tube"></div>
                    <div class="chute-tray"></div>
                </div>
            </div>
        </div>

        <div class="result-container">
            <div id="result" class="result"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
